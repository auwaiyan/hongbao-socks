<!doctype html>
<html>
<head>
{{> head}}
</head>
<body>
{{> header}}
<main>
  <section class="band guides-hero">
    <div class="container">
      <p class="eyebrow">Buyer resources</p>
      <h1>Sock sourcing guides for brands and buyers</h1>
      <p class="section-sub">Practical information for planning a custom, OEM or private-label sock programme with more confidence.</p>
      <div class="guide-grid">
      {{#each guides}}
        <article class="guide-card">
          <p class="guide-label">Sourcing guide</p>
          <h2>{{title}}</h2>
          <p>{{description}}</p>
          <a class="text-link" href="{{__base}}/en/guides/{{slug}}.html">Read guide →</a>
        </article>
      {{/each}}
      </div>
    </div>
  </section>
</main>
{{> footer}}
<script src="{{__base}}/assets/js/main.js" defer></script>
</body>
</html>
