<section class="band why-us" id="why">
  <div class="container">
    <header class="section-head reveal">
      <p class="eyebrow">{{whyUs.eyebrow}}</p>
      <h2>{{whyUs.title}}</h2>
      <p class="section-sub">{{whyUs.subtitle}}</p>
    </header>
    <ul class="why-grid reveal">
      {{#each whyUs.items}}
      <li class="why-item">
        <span class="why-check" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M4 10l4 4 8-8" fill="none" stroke="#5C7A5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div><h3>{{title}}</h3><p>{{desc}}</p></div>
      </li>
      {{/each}}
    </ul>
  </div>
</section>
