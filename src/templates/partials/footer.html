<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <p class="footer-legal">{{footer.legalName}}</p>
      <p class="footer-addr">{{footer.address}} · {{footer.region}}</p>
      <p class="footer-contact"><span>{{footer.emailLabel}}:</span> <a href="mailto:{{footer.email}}">{{footer.email}}</a></p>
      <p class="footer-contact"><span>{{footer.whatsappLabel}}:</span> <a href="https://wa.me/8618823182690">{{footer.whatsapp}}</a></p>
      <p class="footer-contact"><a href="{{__base}}/en/guides.html">Buyer resources</a></p>
      <p class="footer-tag">{{footer.tagline}}</p>
    </div>
    <div class="footer-meta">
      <p class="footer-certs">{{footer.certs}}</p>
      <p class="footer-copy">{{footer.copyright}} <a href="#privacy">{{footer.privacy}}</a></p>
    </div>
  </div>
</footer>
